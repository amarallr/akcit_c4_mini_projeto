name: Testes com fixtures
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      RENV_CONFIG_CACHE_ENABLED: 'FALSE'
      RENV_PATHS_ROOT: ${{ github.workspace }}/tmp/renv
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - name: Bibliotecas de sistema no Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev
      - name: Restaurar dependências fixadas
        run: Rscript --vanilla scripts/p02_dependencias.R restaurar
      - name: Executar suíte sem CVM ou credenciais
        run: Rscript --vanilla scripts/p02_testar.R todas
      - name: Guardar evidência da CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-${{ matrix.os }}
          path: |
            logs/testes.rds
            logs/testes_resumo.json
          if-no-files-found: ignore
