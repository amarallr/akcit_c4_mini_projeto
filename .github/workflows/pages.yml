name: Publicar análises no GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'resultados/estatisticas/**'
      - 'web/**'
      - 'referencias/cvm/*.csv'
      - 'scripts/publicar_resumo.ps1'
      - 'scripts/p08_validar_publicacao.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gerar página a partir do resumo
        shell: pwsh
        run: ./scripts/publicar_resumo.ps1
      - name: Validar JavaScript, manifesto, dados e links antes do deploy
        run: |
          node --check web/painel.js
          node scripts/p08_validar_publicacao.cjs site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
